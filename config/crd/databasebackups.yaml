apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: databasebackups.backup.arkive.io
spec:
  group: backup.arkive.io
  names:
    kind: DatabaseBackup
    listKind: DatabaseBackupList
    plural: databasebackups
    singular: databasebackup
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Schedule
          type: string
          jsonPath: .spec.schedule
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=='Ready')].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - database
                - schedule
                - destination
              properties:
                database:
                  type: object
                  required:
                    - host
                    - port
                    - name
                    - credentialsSecret
                  properties:
                    host:
                      type: string
                    port:
                      type: integer
                    name:
                      type: string
                    credentialsSecret:
                      type: object
                      required:
                        - name
                      properties:
                        name:
                          type: string
                        usernameKey:
                          type: string
                        passwordKey:
                          type: string
                schedule:
                  type: string
                suspend:
                  type: boolean
                retention:
                  type: object
                  properties:
                    count:
                      type: integer
                    maxAge:
                      type: string
                destination:
                  type: object
                  required:
                    - type
                    - bucket
                    - region
                    - prefix
                  properties:
                    type:
                      type: string
                    bucket:
                      type: string
                    region:
                      type: string
                    prefix:
                      type: string
                    deleteOnResourceDeletion:
                      type: boolean
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                lastScheduledTime:
                  type: string
                  format: date-time
                lastSuccessfulBackupTime:
                  type: string
                  format: date-time
                lastBackupObjectKey:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
