apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: databaserestores.backup.arkive.io
spec:
  group: backup.arkive.io
  names:
    kind: DatabaseRestore
    listKind: DatabaseRestoreList
    plural: databaserestores
    singular: databaserestore
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - sourceBackupObjectKey
                - targetDatabase
              properties:
                sourceBackupObjectKey:
                  type: string
                targetDatabase:
                  type: object
                  required:
                    - host
                    - port
                    - name
                    - credentialsSecret
                  properties:
                    host:
                      type: string
                    port:
                      type: integer
                    name:
                      type: string
                    credentialsSecret:
                      type: object
                      required:
                        - name
                      properties:
                        name:
                          type: string
                        usernameKey:
                          type: string
                        passwordKey:
                          type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                startTime:
                  type: string
                  format: date-time
                completionTime:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
